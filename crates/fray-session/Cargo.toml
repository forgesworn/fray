[package]
name = "fray-session"
description = "Fray's game-session state machines (host migration, room-code format). No I/O: no sockets, no async runtime."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["session", "authority"]
session = ["dep:getrandom", "dep:nostr", "dep:serde", "dep:sha2"]
authority = ["dep:serde", "dep:sha2"]

[dependencies]
getrandom = { version = "0.3", optional = true }
nostr = { version = "=0.44.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
