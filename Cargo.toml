[workspace]
resolver = "2"
members = ["crates/decented-net", "crates/decented-relays", "crates/fray-session", "crates/fray-keep"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ForgeSworn"]

[profile.dev]
debug = 0
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
